name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# 連続 push 時は古いレビューをキャンセルして opencode Go の利用枠を節約する
concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    # 権限の確認待ちなどで止まったときに、6 時間（既定の上限）待たずに失敗させる
    timeout-minutes: 15
    # use_github_token: true のため OIDC は使われず id-token: write は不要
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: anomalyco/opencode/github@e3c4eb242585dcd77be1a867391b7c25fd47ce52 # v1.19.3
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode-go/glm-5.3-flash
          variant: max
          agent: review
          use_github_token: true
