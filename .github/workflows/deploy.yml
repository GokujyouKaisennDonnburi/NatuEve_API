name: Deploy

# main への push で CI が成功したら、検証環境へデプロイし、承認後に同じイメージを本番へデプロイする（ADR-0036・ADR-0040）。
# 初期設定（GCP・GitHub Environments・Cloudflare）は docs/Deployment.md の「CI/CD の初期設定」を参照。
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  REGION: asia-northeast1
  SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  staging:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v4

      # Cloud Run に渡すイメージを 1 つのマニフェストにするため、provenance と SBOM は付けない。
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}/api:${{ env.SHA }}

      - id: image
        name: Image reference
        run: echo "image=${REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}/api@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Migrate
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: deploy/migrate.sh

      - name: Deploy API
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
          GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          SUPABASE_JWKS_URL: ${{ vars.SUPABASE_JWKS_URL }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          SCHEDULER_OIDC_AUDIENCE: ${{ vars.SCHEDULER_OIDC_AUDIENCE }}
          SCHEDULER_SERVICE_ACCOUNT_EMAIL: ${{ vars.SCHEDULER_SERVICE_ACCOUNT_EMAIL }}
          RELAY_SECRET_PREVIOUS_VERSION: ${{ vars.RELAY_SECRET_PREVIOUS_VERSION }}
        run: deploy/cloud-run-deploy.sh staging "${{ steps.image.outputs.image }}"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install Worker dependencies
        run: make worker-install

      - name: Deploy Worker
        working-directory: workers/api-relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy --env staging

  production:
    needs: staging
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # 承認待ちの間に main が進んでいたら、古いイメージで本番を上書きしないよう止める（ADR-0040 決定事項 5）。
      - name: Check this run is the latest main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$latest" != "$SHA" ]; then
            echo "::error::この実行のコミット（${SHA}）は main の最新（${latest}）ではありません。最新の実行を承認してください。"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - id: image
        name: Copy image to production
        env:
          SOURCE_IMAGE: ${{ needs.staging.outputs.image }}
          DIGEST: ${{ needs.staging.outputs.digest }}
        run: |
          go install github.com/google/go-containerregistry/cmd/crane@v0.22.1
          repo="${REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}/api"
          "$(go env GOPATH)/bin/crane" copy "$SOURCE_IMAGE" "${repo}:${SHA}"
          copied="$("$(go env GOPATH)/bin/crane" digest "${repo}:${SHA}")"
          if [ "$copied" != "$DIGEST" ]; then
            echo "::error::コピー後のダイジェスト（${copied}）が検証環境（${DIGEST}）と一致しません。"
            exit 1
          fi
          echo "image=${repo}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Migrate
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: deploy/migrate.sh

      - name: Deploy API
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
          GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          SUPABASE_JWKS_URL: ${{ vars.SUPABASE_JWKS_URL }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          SCHEDULER_OIDC_AUDIENCE: ${{ vars.SCHEDULER_OIDC_AUDIENCE }}
          SCHEDULER_SERVICE_ACCOUNT_EMAIL: ${{ vars.SCHEDULER_SERVICE_ACCOUNT_EMAIL }}
          RELAY_SECRET_PREVIOUS_VERSION: ${{ vars.RELAY_SECRET_PREVIOUS_VERSION }}
        run: deploy/cloud-run-deploy.sh production "${{ steps.image.outputs.image }}"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install Worker dependencies
        run: make worker-install

      - name: Deploy Worker
        working-directory: workers/api-relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy --env=""
