  /api/v1/uploads/presign:
    post:
      consumes:
      - application/json
      description: |-
        指定した kind/contentType に対応する R2 tmp 領域への PUT 署名付き URL を返す。
        返却された uploadUrl に直接 PUT することでクライアントがファイルをアップロードできる。
        取得した objectKey をイベント作成時の imageObjectKeys/pdfObjectKeys に渡すこと。
        kind="image": image/jpeg, image/png のみ対応（WebP は MVP 非対応）。
        kind="pdf": application/pdf のみ対応。
      parameters:
      - description: presign リクエスト
        in: body
        name: body
        required: true
