info:
  contact: {}
  description: NatuEve のバックエンド API
  title: NatuEve API
  version: "1.0"
paths:
  /api/v1/events:
    get:
      description: |-
        公開イベントを指定ソート順で返す。認証不要。
        sort は "created_at"(デフォルト) / "event_date" のみ許可。不正値はデフォルトに戻す。
        order は "desc"(デフォルト) / "asc" のみ許可。不正値はデフォルトに戻す。
        prifileはProfileSummaryを返す。
        q は検索キーワード。反復指定で AND 検索になる（例: ?q=桜&q=東京）。各語はタイトル/イベント詳細/
        主催者名/地域名/持ち物を横断して部分一致で判定し、全語に一致するイベントを返す。未指定なら全件（最大10語）。
        照合は大文字小文字を無視し、半角/全角も同一視する（NFKC正規化。全角数字↔半角数字・全角英字↔半角英字・半角カナ↔全角カナ）。
        tagId はタグでの絞り込み。反復指定は OR 検索になる（例: ?tagId=A&tagId=B なら A または B が付いたイベント）。
        q と同時に指定した場合は AND（キーワード条件かつタグ条件）で絞り込む。
        UUID 形式でない値・21件以上の指定は 400 を返す（値が空の tagId は未指定として無視する）。
        status は開催状況での絞り込み。反復指定は OR 検索になる（例: ?status=upcoming&status=ongoing）。
        値は upcoming(開催前: event_date > now())・ongoing(開催中: event_date <= now() かつ
        end_date >= now())・ended(開催後: end_date < now()) の3値で、排他かつ網羅（どのイベントも必ず1つに該当）。
        q・tagId と同時に指定した場合は AND で絞り込む。許可値以外（大文字表記等）は 400 を返す
        （値が空の status は未指定として無視する）。status は開催状況（時間軸）のみを表し、
        キャンセル済みイベントの判別は含まない（各 status の結果にキャンセル済みイベントも混在するため、
        クライアントは cancelledAt で判別する）。
        location は地域での絞り込み。反復指定は OR 検索になる（例: ?location=東京都&location=神奈川県）。
        q が5項目（タイトル/詳細/主催者名/地域名/持ち物）を横断するのに対し、location は地域名のみを
        対象に部分一致で判定する。q・tagId・status と同時に指定した場合は AND で絞り込む。
        照合は大文字小文字を無視し、半角/全角も同一視する（NFKC正規化。q と同じ規則）。
        重複指定は1件として扱い、重複除去後の件数が201件以上、または1件あたり256文字以上の指定は
        400 を返す（値が空の location は未指定として無視する）。
        location に送る値は正式名称で指定する。都道府県は"京都府"/"東京都"のように正式名称、
        市区町村は"兵庫県神戸市"のように都道府県名を前置した形で送る。部分一致のため"京都"のような
        略称を送ると"東京都"に部分一致してしまう（"東京都"が"京都"を含むため）。"府中市"のように
        複数県に同名の市区町村が存在するため、都道府県名の前置が必要になる。サーバー側では
        値の形式を検証しない。
        推奨: 階層UIで親（都道府県）を全選択した場合は親のみを送るとよい。部分一致のため
        "兵庫県"1件で配下の市区町村をすべてカバーできる。全選択の場合は location 自体を
        省略する方が速い。これは推奨であり必須ではない。
      parameters:
      - collectionFormat: multi
        description: 検索キーワード(反復指定でAND検索。各語を5項目横断・部分一致・大小無視。最大10件)
        in: query
        items:
          type: string
        name: q
        type: array
      - collectionFormat: multi
        description: 絞り込むタグID(UUID。反復指定でOR検索。最大20件)
        in: query
        items:
          type: string
        name: tagId
        type: array
      - collectionFormat: multi
        description: 開催状況(upcoming|ongoing|ended。反復指定でOR検索)
        in: query
        items:
          type: string
        name: status
        type: array
      - collectionFormat: multi
        description: 絞り込む地域(location への部分一致。反復指定でOR検索。最大200件・1件255文字以内)
        in: query
        items:
          type: string
        name: location
        type: array
      - description: 'ソートカラム(created_at|event_date, default: created_at)'
        in: query
        name: sort
        type: string
      - description: 'ソート順(asc|desc, default: desc)'
        in: query
        name: order
        type: string
      - description: 取得件数(default 20, 最大 100)
        in: query
        name: limit
        type: integer
      - description: 取得開始位置(default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.EventListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.ValidationErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.InternalErrorResponse'
      summary: イベント一覧取得
      tags:
      - event
    post:
      consumes:
      - application/json
      description: 認証済みユーザーが新規イベントを投稿する。
      parameters:
      - description: イベント投稿リクエスト
        in: body
        name: body
