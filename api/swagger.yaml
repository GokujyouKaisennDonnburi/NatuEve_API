  /api/v1/events/{id}/join:
    post:
      consumes:
      - application/json
      description: |-
        認証は任意。ログイン時のみ profileId が記録される。
        Authorization ヘッダなし → 匿名参加（profileId = null）。
        ヘッダありでトークンが無効 → 401 で中断。
        ヘッダありで有効 → profileId を記録してログイン参加。
        参加人数はカテゴリ別の内訳（participants）で送る。カテゴリにはイベントの費用カテゴリ名
        （イベント詳細の costs[].category）を指定する。大文字小文字は区別しない。
        合計人数（partySize）はサーバーが内訳から算出するため、リクエストでは送らない。
        0人のカテゴリは送らない。存在しないカテゴリ・重複カテゴリ・0以下の人数は400を返す。
        イベント定員を超える場合は409 Conflict（capacity_full）を返す。
      parameters:
      - description: イベントID
        in: path
        name: id
        required: true
        type: string
      - description: 参加申込
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.JoinEventRequest'
