        description: Counts は公開する2種別の件数。タブのバッジ表示に使う（1回のリクエストで揃う）。
      events:
        description: Events はイベントサマリーの一覧（リクエストの type に対応する）。
        items:
          $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.EventSummary'
