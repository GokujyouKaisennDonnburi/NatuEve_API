      description: 認証済みユーザー自身のプロフィールを返す(初回アクセス時に自動作成)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.ProfileResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.UnauthorizedErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.InternalErrorResponse'
      security:
      - BearerAuth: []
      summary: 本人プロフィール取得
      tags:
      - user
    patch:
      consumes:
      - application/json
      description: 認証済みユーザー自身のプロフィールを更新する
      parameters:
      - description: 更新内容
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.ProfileResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.ValidationErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.UnauthorizedErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.NotFoundErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.RequestTooLargeErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.InternalErrorResponse'
      security:
      - BearerAuth: []
      summary: 本人プロフィール更新
      tags:
      - user
  /api/v1/me/events:
    get:
      description: |-
        認証済みユーザー自身のイベントを種別ごとに返す。
        type は必須。"hosted"(主催したイベント) / "applied"(申し込み中イベント) /
        "attended"(参加済みイベント) のいずれかで、未指定・不正値は 400 を返す。
        hosted は自分が投稿したイベント全件（過去・キャンセル済みを含む）。
        applied は申込済みでイベント終了日時(endDate)が未到来のもの、attended は終了日時を過ぎたもの。
        参加をキャンセル(leave)したイベントと、ログインせずに申し込んだイベントは applied / attended に含まれない。
        counts には3種別すべての件数を常に含める（タブのバッジ表示用）。totalCount は type に対応する件数。
        events の各要素は GET /api/v1/events と同じ EventSummary。
        sort は "created_at"(デフォルト) / "event_date" のみ許可。不正値はデフォルトに戻す。
        order は "desc"(デフォルト) / "asc" のみ許可。不正値はデフォルトに戻す。
      parameters:
      - description: 取得する種別(hosted|applied|attended)
        in: query
        name: type
        required: true
        type: string
      - description: 'ソートカラム(created_at|event_date, default: created_at)'
        in: query
        name: sort
        type: string
      - description: 'ソート順(asc|desc, default: desc)'
        in: query
        name: order
        type: string
      - description: 取得件数(default 20, 最大 100)
        in: query
        name: limit
        type: integer
      - description: 取得開始位置(default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.MyEventListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.ValidationErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.UnauthorizedErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.InternalErrorResponse'
      security:
      - BearerAuth: []
      summary: マイページのイベント一覧取得
      tags:
      - user
  /api/v1/profiles/{id}:
    get:
      description: 指定したユーザー ID のプロフィールを返す
      parameters:
      - description: ユーザー ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.ProfilePublic'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.NotFoundErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.InternalErrorResponse'
      summary: ユーザープロフィール取得
      tags:
      - user
  /api/v1/profiles/{id}/events:
    get:
      description: |-
        指定したユーザーが主催したイベント／参加済みイベントを返す。認証不要。
        type は必須。"hosted"(主催したイベント) / "attended"(参加済みイベント) のいずれかで、
        未指定・不正値は 400 を返す。"applied"(申し込み中) は本人限定のため公開せず、
        本人が取得する場合は GET /api/v1/me/events を使う。
        hosted はそのユーザーが投稿したイベント全件（過去・キャンセル済みを含む）。
        attended は申込済みでイベント終了日時(endDate)を過ぎたもの。
        参加をキャンセル(leave)したイベントと、ログインせずに申し込んだイベントは attended に含まれない。
        counts には公開する2種別の件数を常に含める（タブのバッジ表示用）。totalCount は type に対応する件数。
        events の各要素は GET /api/v1/events と同じ EventSummary。
        sort は "created_at"(デフォルト) / "event_date" のみ許可。不正値はデフォルトに戻す。
        order は "desc"(デフォルト) / "asc" のみ許可。不正値はデフォルトに戻す。
      parameters:
      - description: ユーザー ID
        in: path
        name: id
        required: true
        type: string
      - description: 取得する種別(hosted|attended)
        in: query
        name: type
        required: true
        type: string
      - description: 'ソートカラム(created_at|event_date, default: created_at)'
        in: query
        name: sort
        type: string
      - description: 'ソート順(asc|desc, default: desc)'
        in: query
        name: order
        type: string
      - description: 取得件数(default 20, 最大 100)
        in: query
        name: limit
        type: integer
      - description: 取得開始位置(default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.ProfileEventListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.ValidationErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.NotFoundErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.InternalErrorResponse'
      summary: プロフィールのイベント一覧取得
      tags:
      - user
  /api/v1/reports:
    post:
      consumes:
      - application/json
      description: 認証済みユーザーがイベントに対してレポートを投稿する。
      parameters:
      - description: レポート投稿リクエスト
