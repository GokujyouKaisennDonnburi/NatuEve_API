basePath: /
definitions:
  github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.CancelEventRequest:
    description: イベント取りやめ確定時に参加者へ送る通知の件名・本文。同一トランザクションで outbox に予約され、バックグラウンドワーカーが参加者へ個別送信する。
      件名・本文はいずれも任意で、省略（空文字）時はサーバーが既定文面を補って予約する。
    properties:
      body:
        description: |-
          Body は参加者へ送る通知メールの本文（任意・10,000文字以内）。
          省略（空文字）時はサーバーが既定文面を補う。
        example: 台風接近に伴い、安全のため本イベントは中止とさせていただきます。
        maxLength: 10000
        type: string
      subject:
        description: |-
          Subject は参加者へ送る通知メールの件名（任意・255文字以内）。
          省略（空文字）時はサーバーが既定文面を補う。
        example: 【重要】イベント開催中止のお知らせ
        maxLength: 255
        type: string
    type: object
  github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.CancelEventResponse:
    properties:
      cancelledAt:
        description: CancelledAt はキャンセル日時(RFC3339)。
        example: "2026-06-25T10:00:00Z"
        type: string
      id:
        description: ID はキャンセルしたイベントの UUID。
        example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        type: string
    type: object
  github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.ConflictErrorBody:
    properties:
      code:
        description: Code は機械可読なエラーコード。
        example: conflict
        type: string
      message:
        description: Message は人間向けのエラーメッセージ。
        example: 既に参加しています
        type: string
    type: object
  github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.ConflictErrorResponse:
    properties:
      error:
        $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.ConflictErrorBody'
    type: object
  github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.CreateEventRequest:
    description: イベント投稿に必要な情報。
    properties:
      capacity:
        description: Capacity は定員（任意・0=未設定・正数=定員）。
        example: 30
        minimum: 0
        type: integer
      costs:
        description: Costs は費用内訳（1件以上必須）。
        items:
          $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.EventCostInput'
        minItems: 1
        type: array
      description:
        description: Description はイベント説明（必須・10,000文字以内）。
        example: 春の桜を観察するイベントです。
        maxLength: 10000
        type: string
      endDate:
        description: EndDate はイベント終了日時(RFC3339)（任意）。省略時は EventDate と同値を補完する。
        example: "2026-07-01T17:00:00Z"
        type: string
      eventDate:
        description: EventDate はイベント開催日時(RFC3339)（必須）。
        example: "2026-07-01T10:00:00Z"
        type: string
      externalUrl:
        description: ExternalURL は関連URLs（任意・255文字以内・http/https）。
        example: https://example.com/event
        maxLength: 255
        type: string
      imageFilenames:
        description: |-
          ImageFilenames は画像の元ファイル名一覧（任意）。指定時は ImageObjectKeys と同数・同順。
          ダウンロード時のファイル名（Content-Disposition）と UI 表示に使う。
        items:
          type: string
        type: array
      imageObjectKeys:
        description: ImageObjectKeys は画像オブジェクトキーの一覧（任意）。
        items:
          type: string
        type: array
      items:
        description: Items は持ち物リスト（任意）。
        items:
          $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.EventItemInput'
        type: array
      location:
        description: Location は開催場所（必須・255文字以内）。
        example: 東京都新宿御苑
        maxLength: 255
        type: string
      pdfFilenames:
        description: PdfFilenames はPDFの元ファイル名一覧（任意）。指定時は PdfObjectKeys と同数・同順。
        items:
          type: string
        type: array
      pdfObjectKeys:
        description: PdfObjectKeys はPDFオブジェクトキーの一覧（任意・各要素255文字以内）。
        items:
          type: string
        type: array
      tagIds:
        description: TagIDs は紐づけるタグの UUID 一覧（任意）。
        example:
        - a1b2c3d4-e5f6-7890-abcd-ef1234567890
        items:
          type: string
        type: array
      title:
        description: Title はイベントタイトル（必須・255文字以内）。
        example: サクラ観察会
        maxLength: 255
        type: string
    required:
    - costs
    - description
    - eventDate
    - location
    - title
    type: object
  github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.CreateEventResponse:
    properties:
      createdAt:
        description: CreatedAt はレコード作成日時(RFC3339)。
        example: "2026-06-23T12:00:00Z"
        type: string
      id:
        description: ID は生成されたイベントの UUID。
        example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        type: string
    type: object
  github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.CreateParticipationLogRequest:
    description: イベント参加状態ログ追加に必要な情報。認証必須。
    properties:
      action:
        description: Action は参加状態（必須・join または leave）。
        enum:
        - join
        - leave
        example: join
        type: string
    required:
    - action
    type: object
  github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.CreateReportRequest:
    description: レポート投稿に必要な情報。
    properties:
      content:
        description: Content はレポート内容（必須・10,000文字以内）。
        example: 多摩川アメリカザリガニ殲滅作戦の結果、参加者：5人、アメリカザリガニ防除数：138匹でした。
        maxLength: 10000
        type: string
      eventId:
        description: EventID はレポート対象のイベントID（必須・255文字以内）。
        example: event_1234567890
        maxLength: 255
        type: string
      externalUrls:
        description: ExternalUrls は外部レポートの参照URL一覧（任意・各要素2048文字以内・http/https のみ）。
        items:
          type: string
        type: array
      imageFilenames:
        description: ImageFilenames は画像の元ファイル名一覧（任意）。指定時は ImageObjectKeys と同数・同順。
        items:
          type: string
        type: array
      imageObjectKeys:
        description: ImageObjectKeys は画像オブジェクトキーの一覧（任意）。
        items:
          type: string
        type: array
      pdfFilenames:
        description: PdfFilenames はPDFの元ファイル名一覧（任意）。指定時は PdfObjectKeys と同数・同順。
        items:
          type: string
        type: array
      pdfObjectKeys:
        description: PdfObjectKeys はPDFオブジェクトキーの一覧（任意・各要素255文字以内）。
        items:
          type: string
        type: array
    required:
    - content
    - eventId
    type: object
  github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.CreateReportResponse:
    properties:
      createdAt:
        description: CreatedAt はレコード作成日時(RFC3339)。DB の TIMESTAMPTZ を UTC で保持する。
        example: "2026-06-26T03:08:24Z"
        type: string
      reportId:
        description: ReportID は作成されたレポートのID。
        example: report_1234567890
        type: string
    type: object
  github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.CreateTagRequest:
    properties:
      name:
        description: Name はタグ名。
        example: 外来生物
        maxLength: 30
        type: string
    required:
    - name
    type: object
  github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.ErrorBody:
    properties:
      code:
        description: Code は機械可読なエラーコード。
        example: internal_error
        type: string
      message:
        description: Message は人間向けのエラーメッセージ。
        example: サーバー内部でエラーが発生しました
        type: string
    type: object
  github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.ErrorBody'
    type: object
  github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.EventCostInput:
    properties:
      category:
        description: 'Category は費用カテゴリ（例: "参加費"）。'
        maxLength: 255
        type: string
      cost:
        description: Cost は費用（円）。0 以上の整数。
        minimum: 0
        type: integer
    required:
    - category
    type: object
  github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.EventCostResponse:
    properties:
      category:
        type: string
      cost:
        type: integer
    type: object
  github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.EventItemInput:
    properties:
      isRequired:
        description: IsRequired は必須かどうか。
        type: boolean
      item:
        description: 'Item は持ち物名（例: "双眼鏡"）。'
        maxLength: 255
        type: string
    required:
    - item
    type: object
  github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.EventItemResponse:
    properties:
      isRequired:
        type: boolean
      item:
        type: string
    type: object
  github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.EventListResponse:
    properties:
      events:
        description: Events はイベントサマリーの一覧。
        items:
          $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.EventSummary'
        type: array
      limit:
        description: Limit は正規化後の実際に使われた取得件数。
        example: 20
        type: integer
      offset:
        description: Offset は正規化後の実際に使われた取得開始位置。
        example: 0
        type: integer
      totalCount:
        description: |-
          TotalCount は現在の絞り込み条件（q / tagId / status / location）に一致する総件数。
          条件を指定しない場合は全件数になる。クライアントが最終ページ offset を算出するために使う。
        example: 153
        type: integer
    type: object
  github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.EventMemberListResponse:
    properties:
      members:
        description: Members は参加者の一覧。0件の場合は空配列（null ではない）。
        items:
          $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.EventMemberResponse'
        type: array
      totalCount:
        description: TotalCount は参加者総数（client の表示用）。
        example: 5
        type: integer
      totalMembers:
        description: TotalMembers は全参加者の partySize 合計（実際の総参加人数）。
        example: 8
        type: integer
    type: object
  github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.EventMemberResponse:
    description: 参加者1人分の情報。匿名参加かどうかは profile が null かどうかで判定できる。 profile は参加者のプロフィールサマリー。匿名参加の場合
      null。 username は申込時に入力された名前で、profile.displayName（アカウントの表示名）とは別物。
    properties:
      createdAt:
        description: CreatedAt は参加申込日時(RFC3339)。
        example: "2026-07-01T12:00:00Z"
        type: string
      mailAddress:
        description: MailAddress は参加者のメールアドレス。
        example: yamada@example.com
        type: string
      participants:
        description: |-
          Participants はカテゴリ別人数の内訳。イベントの費用カテゴリの登録順で返す。
          内訳を持たない参加者では空配列（null ではない）。
        items:
          $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.ParticipantResponse'
        type: array
      partySize:
        description: PartySize は代表者を含む参加人数。participants の合計と一致する。
        example: 3
        type: integer
      profile:
        allOf:
        - $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.ProfileSummary'
        description: |-
          Profile は参加者のプロフィールサマリー（表示名・アイコン URL）。匿名参加の場合は null。
          Username は申込時に入力された名前で、Profile.DisplayName（アカウントの表示名）とは別物。
        x-nullable: true
      username:
        description: |-
          Username は申込時にフォームへ入力された名前。参加者が名乗った名前のスナップショットで、
          保存後は変更されない。アカウントの表示名（Profile.DisplayName）とは別物で、
          ログイン参加でも一致するとは限らない。匿名参加でも必ず値が入る。
        example: 山田太郎
        type: string
    type: object
  github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.EventResponse:
    properties:
      cancelledAt:
        description: CancelledAt はイベントが取りやめになった日時(RFC3339)。nil の場合は開催予定。
        type: string
      capacity:
        type: integer
      costs:
        items:
          $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.EventCostResponse'
        type: array
      createdAt:
        type: string
      description:
        type: string
      endDate:
        type: string
      eventDate:
        type: string
      externalUrl:
        type: string
      id:
        type: string
      imageFilenames:
        description: ImageFilenames は ImageObjectKeys に対応する元ファイル名（未設定は空文字）。
        items:
          type: string
        type: array
      imageObjectKeys:
        items:
          type: string
        type: array
      imageUrls:
        description: |-
          ImageUrls は ImageObjectKeys に対応する表示用の完全URL。
          公開ベースURL（R2_PUBLIC_BASE_URL）未設定時は空配列。
        items:
          type: string
        type: array
      items:
        items:
          $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.EventItemResponse'
        type: array
      location:
        type: string
      participantCount:
        description: |-
          ParticipantCount は現在申込中の参加人数の合計（各申込の partySize の合計）。
          定員未設定（capacity=0）でも値を返す。定員がある場合の残り人数は
          capacity - participantCount で算出する（ADR-0024）。
        example: 20
        type: integer
      pdfFilenames:
        description: PdfFilenames は PdfObjectKeys に対応する元ファイル名（未設定は空文字）。
        items:
          type: string
        type: array
      pdfObjectKeys:
        items:
          type: string
        type: array
      pdfUrls:
        description: |-
          PdfUrls は PdfObjectKeys に対応する表示用の完全URL。
          公開ベースURL（R2_PUBLIC_BASE_URL）未設定時は空配列。
        items:
          type: string
        type: array
      profile:
        $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.ProfileSummary'
      tags:
        description: Tags は紐づくタグの一覧（name 昇順）。
        items:
          $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.TagResponse'
        type: array
      title:
        type: string
      updatedAt:
        type: string
    type: object
  github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.EventSummary:
    properties:
      cancelledAt:
        description: CancelledAt はイベントが取りやめになった日時(RFC3339)。nil の場合は開催予定。
        example: "2026-06-25T10:00:00Z"
        type: string
      createdAt:
        description: CreatedAt はレコード作成日時(RFC3339)。
        example: "2026-06-22T12:00:00Z"
        type: string
      endDate:
        description: EndDate はイベント終了日時(RFC3339)（任意）。省略時は EventDate と同値を補完する。
        example: "2026-07-01T17:00:00Z"
        type: string
      eventDate:
        description: EventDate はイベント開催日時(RFC3339)。
        example: "2026-07-01T10:00:00Z"
        type: string
      id:
        description: ID はイベントの一意識別子(UUID)。
        example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        type: string
      location:
        description: Location は開催場所（文字列）。
        example: 東京都新宿御苑
        type: string
      profile:
        allOf:
        - $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.ProfileSummary'
        description: ProfileSummary は投稿者プロフィールのサマリー情報。
      profileId:
        description: ProfileID は投稿者のプロフィール ID(UUID)。
        example: d290f1ee-6c54-4b01-90e6-d701748f0851
        type: string
      tags:
        description: Tags は紐づくタグの一覧（name 昇順）。タグが無い場合は省略される。
        items:
          $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.TagResponse'
        type: array
      title:
        description: Title はイベントタイトル。
        example: サクラ観察会
        type: string
    type: object
  github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.ForbiddenErrorBody:
    properties:
      code:
        description: Code は機械可読なエラーコード。
        example: forbidden
        type: string
      message:
        description: Message は人間向けのエラーメッセージ。
        example: このイベントにレポートを投稿する権限がありません
        type: string
    type: object
  github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.ForbiddenErrorResponse:
    properties:
      error:
        $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.ForbiddenErrorBody'
    type: object
  github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.GoneErrorBody:
    properties:
      code:
        description: Code は機械可読なエラーコード。
        example: gone
        type: string
      message:
        description: Message は人間向けのエラーメッセージ。
        example: このエンドポイントは現在無効です。イベント参加/キャンセルは別APIを利用してください
        type: string
    type: object
  github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.GoneErrorResponse:
    properties:
      error:
        $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.GoneErrorBody'
    type: object
  github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.HealthResponse:
    properties:
      status:
        description: Status はサーバの稼働状態。正常時は "ok"。
        example: ok
        type: string
    type: object
  github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.InternalErrorBody:
    properties:
      code:
        description: Code は機械可読なエラーコード。
        example: internal_error
        type: string
      message:
        description: Message は人間向けのエラーメッセージ。
        example: サーバー内部でエラーが発生しました
        type: string
    type: object
  github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.InternalErrorResponse:
    properties:
      error:
        $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.InternalErrorBody'
    type: object
  github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.JoinConflictErrorBody:
    properties:
      code:
        description: |-
          Code は競合の原因を表す機械可読なエラーコード。
          already_joined = 既に参加済み / capacity_full = 定員到達。
        enum:
        - already_joined
        - capacity_full
        example: already_joined
        type: string
      message:
        description: |-
          Message は人間向けのエラーメッセージ。
          already_joined なら「既に参加しています」、capacity_full なら「定員に達しています」。
        example: 既に参加しています
        type: string
    type: object
  github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.JoinConflictErrorResponse:
    properties:
      error:
        $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.JoinConflictErrorBody'
    type: object
  github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.JoinEventRequest:
    description: イベント参加申込に必要な情報。認証は任意。 参加人数はカテゴリ別の内訳（participants）で送る。合計はサーバーが算出する。
    properties:
      mailAddress:
        description: MailAddress は参加するユーザーのメールアドレス（必須）。
        example: yamada@example.com
        maxLength: 255
        type: string
      participants:
        description: |-
          Participants はカテゴリ別の参加人数（必須・1件以上）。
          同一カテゴリを複数の要素に分けて送ることはできない。
        items:
          $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.ParticipantInput'
        minItems: 1
        type: array
      username:
        description: Username は参加するユーザーの表示名（必須・255文字以内）。
        example: 山田太郎
        maxLength: 255
        type: string
    required:
    - mailAddress
    - participants
    - username
    type: object
  github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.JoinEventResponse:
    properties:
      createdAt:
        description: CreatedAt は参加申込日時。
        example: "2023-01-01T12:00:00Z"
        type: string
      eventId:
        description: EventID は参加したイベントのUUID。
        example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        type: string
      mailAddress:
        description: MailAddress は参加するユーザーのメールアドレス。
        example: yamada@example.com
        type: string
      participants:
        description: Participants は登録されたカテゴリ別人数。イベントの費用カテゴリの登録順で返す。
        items:
          $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.ParticipantResponse'
        type: array
      partySize:
        description: PartySize は participants の合計人数（サーバーが算出した値）。
        example: 3
        type: integer
      profileId:
        description: ProfileID は参加するユーザーのUUID。ログイン時のみ記録され、匿名参加時は null。
        example: b2c3d4e5-f6a7-8901-bcde-f23456789012
        type: string
      username:
        description: Username は参加するユーザーの表示名。
        example: 山田太郎
        type: string
    type: object
  github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.LeaveEventResponse:
    description: 参加キャンセルの結果。追記された参加状態ログ（action=leave）1件分の内容を返す。
    properties:
      action:
        description: Action は参加状態ログのアクション。常に "leave"。
        example: leave
        type: string
      createdAt:
        description: CreatedAt は参加状態ログ（leave）の記録日時。
        example: "2026-07-01T12:00:00Z"
        type: string
      eventId:
        description: EventID はキャンセルしたイベントのUUID。
        example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        type: string
      profileId:
        description: ProfileID はキャンセルしたユーザーのUUID。leave は認証必須のため常に値が入る。
        example: b2c3d4e5-f6a7-8901-bcde-f23456789012
        type: string
    type: object
  github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.MyEventApplicationResponse:
    properties:
      createdAt:
        description: CreatedAt は参加申込日時。
        example: "2026-08-01T12:34:56Z"
        type: string
      eventId:
        description: EventID は申込先イベントのUUID。
        example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        type: string
      mailAddress:
        description: MailAddress は申込時に入力されたメールアドレス。
        example: yamada@example.com
        type: string
      participants:
        description: |-
          Participants はカテゴリ別人数の内訳（カテゴリ名の昇順）。
          API 経由の申込では必ず1件以上入る。DB は内訳0件を禁じていないため、
          直接 INSERT された行では空配列になりうる（ADR-0026）。
        items:
          $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.ParticipantResponse'
        type: array
      partySize:
        description: PartySize は代表者を含む参加人数。participants の合計と一致する。
        example: 3
        type: integer
      username:
        description: Username は申込時にフォームへ入力された名前。
        example: 山田太郎
        type: string
    type: object
  github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.MyEventCounts:
    properties:
      applied:
        description: Applied は申し込み中のイベントの件数。
        example: 2
        type: integer
      attended:
        description: Attended は参加済みのイベントの件数。
        example: 3
        type: integer
      hosted:
        description: Hosted は主催したイベントの件数。
        example: 4
        type: integer
    type: object
  github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.MyEventListResponse:
    description: 指定種別のイベント一覧と、3種別すべての件数。
    properties:
      counts:
        allOf:
        - $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.MyEventCounts'
        description: Counts は3種別すべての件数。タブのバッジ表示に使う（1回のリクエストで揃う）。
      events:
        description: Events はイベントサマリーの一覧（種別は counts ではなくリクエストの type に対応する）。
        items:
          $ref: '#/definitions/github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.EventSummary'
        type: array
      limit:
        description: Limit は正規化後の実際に使われた取得件数。
        example: 20
        type: integer
      offset:
        description: Offset は正規化後の実際に使われた取得開始位置。
        example: 0
        type: integer
      totalCount:
        description: TotalCount はリクエストした種別の総件数（counts の該当値と一致する）。
        example: 2
        type: integer
    type: object
  github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.NotFoundErrorBody:
    properties:
      code:
        description: Code は機械可読なエラーコード。
        example: not_found
