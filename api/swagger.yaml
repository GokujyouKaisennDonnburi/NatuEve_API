    type: object
  github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.ParticipantInput:
    properties:
      category:
        description: |-
          Category は参加者カテゴリ（必須・255文字以内）。
          そのイベントの費用カテゴリ（costs[].category）に実在する名前を指定する。
          大文字小文字は区別しない。
        example: 大人
        maxLength: 255
        type: string
      headCount:
        description: HeadCount はそのカテゴリの人数（必須・1以上）。0人のカテゴリは送らない。
        example: 2
        minimum: 1
        type: integer
    required:
    - category
    - headCount
    type: object
  github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.ParticipantResponse:
    properties:
      category:
        description: Category は参加者カテゴリ。
        example: 大人
        type: string
      headCount:
        description: HeadCount はそのカテゴリの人数。
        example: 2
        type: integer
    type: object
  github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.ParticipationStatusResponse:
    description: 認証ユーザー自身の最新の参加状態。履歴が1件もない場合は action=null, participating=false, updatedAt=null。
    properties:
      action:
        description: |-
          Action は最新の参加アクション。履歴なしの場合は null。
          "join" または "leave" のいずれか。
        example: join
        type: string
        x-nullable: true
      participating:
        description: |-
          Participating は最新アクションから派生した参加フラグ。
          action="join" なら true、それ以外（leave or 履歴なし）は false。
        example: true
        type: boolean
      updatedAt:
        description: UpdatedAt は最新アクションの発生日時(RFC3339)。履歴なしの場合は null。
        example: "2026-07-01T12:00:00Z"
        type: string
        x-nullable: true
    type: object
  github_com_GokujyouKaisennDonnburi_NatuEve_API_internal_model.PresignRequest:
